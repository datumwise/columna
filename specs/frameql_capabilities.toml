# ═══════════════════════════════════════════════════════════════════════════════════════════════
# frameql_capabilities.toml — THE CANONICAL FRAME-QL CAPABILITY AUTHORITY (L2)
# ═══════════════════════════════════════════════════════════════════════════════════════════════
#
# ONE GOVERNED CAPABILITY DISPOSITION HAS ONE AUTHORITY. Every Manual, profile and build
# representation of a capability's canonical standing is a CHECKED PROJECTION of this file, never an
# independently maintained claim. This closes the P0-17 class: eight reducer rows were adjudicated
# [ROADMAP] in the Reference Manual, that ruling's repair scope was `/docs/reference` only, and the
# Frame-QL Manual carried the contradicting claim for months because nothing coupled them.
#
# IT LIVES IN `specs/`, NOT IN `columna-core`, DELIBERATELY. Canonical standing is a fact about the
# LANGUAGE. Housing it in one implementation would make the language's own law ship with a Python
# package and would invite exactly the conflation this separation exists to prevent — registry
# membership or `in_core` quietly becoming canonical Frame-QL law. A build realizes capabilities; it
# does not decide which capabilities the language has.
#
# ── WHAT BELONGS HERE (and nothing else) ──────────────────────────────────────────────────────
#   id                    canonical capability identity
#   spellings             canonical surface spelling(s) and declared aliases
#   position              SYNTAX POSITION — a canonical category, not a realization artifact.
#                         "series" (inside a SELECT series expression) or "predicate" (WHERE/HAVING).
#                         A comparison ships in predicate position and can never be a series
#                         operator; that is language structure, not a build accident.
#   category              reducer | scan | map — the canonical kind the language distinguishes
#   standing              ratified | proposed | retired  (ADR-035 D1: the grammar grows BY RULING)
#   re_entry_certified    the capability-INTRINSIC certification (Frame-QL Manual sec.3.2)
#
# ── WHAT IS DELIBERATELY EXCLUDED ─────────────────────────────────────────────────────────────
# This is a CANONICAL CAPABILITY authority, not a universal analytical-law registry.
#
#   * Anything scoped to a Data World — measure family membership, blocked lineages, fill rule Phi,
#     population/universe, per-Manifold certification. Those are governed DECLARATIONS of a Data
#     World and stay there. They are not language-capability facts merely because the current
#     implementation happens to keep them nearby.
#   * Mechanics — witness, combine, deliver_sql, scan_impl. Engine implementation.
#   * `in_core`, registry membership, backend support. REALIZATION: see the profile declarations and
#     the measured build matrix.
#   * `is_monoid`, `linear`. Analytical properties consumed by Data-World-dependent adjudication
#     (the B-anchor crossing check, the WP-B symbolic gate) rather than facts about the capability
#     standing alone.
#   * Type signatures (`accepts` / `out_rule`) and `needs_order` / `needs_window`. Arguably canonical
#     and deliberately left out of v1 pending a ruling — today only Core declares them, and pulling
#     them in would mean transcribing one implementation's signatures as language law.
#
# `re_entry_certified` is here because it IS capability-intrinsic and unconditional: it is a property
# of the capability's own finalization and re-entry, true wherever the capability is lawfully used.
# Whether a PARTICULAR ask may use it additionally depends on the measure's family — that second
# condition is a Data World question and is adjudicated in the planner, not declared here.
#
# THIS FILE HOLDS CAPABILITY IDENTITIES, NOT EVERY SURFACE FORM THE LANGUAGE MENTIONS. `count(*)`
# was carried here briefly as `proposed` and has been REMOVED (ruled 2026-09-01): sec.4.2 says its
# MEANING is unresolved — a bare count(*) names no determinate analytical object — and "proposed"
# says a construct is understood but not yet ruled in, which is a stronger claim than the Manual
# makes. An unruled SURFACE FORM whose capability identity has not been established is recorded in
# the Manual prose that discusses it, not given a row here. Inventing an `unruled` standing to hold
# it would have been the same error one level up.
#
# ALIASES ARE DECLARATIONS, NOT RESEMBLANCES. A spelling joins a capability because a ruling says
# the two name one thing. Reconciliation noticing that `BOOL_OR` looks like `any` is not that, and
# the relationship is recorded as unresolved on those rows rather than merged.
#
# STANDING IS NOT REALIZATION. `proposed` means the language has not ruled the construct in. A build
# may still realize it (Core executes `cumsum` today while sec.2.8 keeps scans roadmap) — that is a
# build EXCEEDING canonical standing, it is visible in the matrix, and it is a question for ruling,
# not something this file may quietly settle by promoting the capability.

schema_version = 1

