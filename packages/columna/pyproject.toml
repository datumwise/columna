[build-system]
requires = ["setuptools>=77,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "columna"
version = "0.17.0"
description = "Columna, by datumwise — an honest data framework (Manifold, FrameQL, an honest engine). Metapackage: installs columna-core + columna-server."
readme = "README.md"
# Must match columna-core's ceiling exactly — this is the package `pip install columna` resolves
# first, so it is where the clean refusal has to happen. See columna-core/pyproject.toml for why.
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Datumwise" }]
keywords = ["analytics", "semantic-layer", "duckdb", "polars", "manifold", "frame-ql", "metapackage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Front-Ends",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    # FLOORS carry the contract; the caps are at the MAJOR (see columna-server/pyproject.toml for
    # why not the minor). The floor on columna-server is what makes the mcp<2.0 fix reach a
    # stranger: `pip install columna` must not be allowed to resolve to the broken 0.8.1.
    #
    # THE CORE FLOOR IS THE RELEASE VERSION, NOT THE PREVIOUS ONE (Huayin, 2026-08-20): the umbrella
    # for release N must not permit installation of a core older than N. A floor left at N-1 lets
    # `pip install columna==N` resolve to a core that does not contain the correction N is named
    # after — an umbrella wearing the version number of a fix it does not require. Enforced by
    # `scripts/release_pins.py --check`.
    "columna-core>=0.17.0,<1.0",
    # The SERVER floor is the release's companion, for the same reason as the core floor
    # (v0.15.0 incident, 2026-08-20): columna 0.15.0 shipped declaring `columna-server>=0.8.2`, and
    # 0.8.2's payload predates the generated-family law — so a fresh `pip install columna==0.15.0`
    # still resolves a server whose four-mood demo contradicts the engine beside it. PyPI metadata is
    # immutable, so that declaration cannot be corrected in place; 0.15.1 is the coherent set.
    "columna-server>=0.11.0,<1.0",
]

[project.urls]
Homepage = "https://datumwise.ai"
Repository = "https://github.com/datumwise/columna"

[tool.setuptools]
packages = ["columna"]
