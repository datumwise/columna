[build-system]
# Capped like every other dependency (the cap guard, 0.13.3). Floor 1.27 = first hatchling with
# PEP 639 `license` + `license-files`, which this file uses.
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "columna-core"
version = "0.14.0"
description = "Columna Core — the definition language, adjudication, and engine of Columna, by datumwise."
readme = "README.md"
# CEILING, not caution (Huayin, 2026-07-27; found on a Windows fresh-venv pass). datasketches 5.x
# publishes NO cp314 wheels on any platform, and no win32 wheels at any Python version. Without the
# upper bound pip considers us a match on 3.14, then tries to compile datasketches from source — a
# C++ toolchain explosion for anyone who lacks one, which is nearly everyone. The bound converts that
# into pip's clean "no matching distribution found" refusal: fail closed with a named reason beats
# rare success for whoever happens to own a compiler. Lift it when datasketches ships cp314, or when
# the optional-extras split (WP-1.1) makes the sketch backend optional at install time.
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Datumwise" }]
keywords = ["analytics", "semantic-layer", "duckdb", "polars", "manifold", "frame-ql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Front-Ends",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# All three are hard imports today (engine.py imports sketch.py at module top; __init__ imports
# connector). Making duckdb / datasketches optional extras is WP-1.1 scope (import-graph
# restructure for the PolarsConnector) and is deliberately NOT attempted here — they stay required.
dependencies = [
    "polars>=1.0,<2.0",
    "duckdb>=1.0,<2.0",
    "datasketches>=5.0,<6.0",
    # Hard runtime dep: connector.py does pl.from_arrow(con.execute(q).arrow()) on every fetch,
    # and polars does not pull pyarrow transitively.
    # Capped at the next major (0.13.3). pyarrow ships a major roughly quarterly — 15 to 25 in
    # about two years — so this ceiling needs a deliberate lift more often than the others. That
    # is the cost of the guarantee, and it is paid on purpose: a quarterly one-line lift beats a
    # stranger's fresh install detonating on a major nobody has run.
    "pyarrow>=15,<26",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0"]

[project.urls]
Homepage = "https://github.com/datumwise/columna"
Repository = "https://github.com/datumwise/columna"

[tool.hatch.build.targets.wheel]
packages = ["src/columna_core"]

[tool.hatch.build.targets.sdist]
# Ship the library and its proof material; keep the heavy real warehouse out of the sdist.
include = [
    "src/columna_core",
    "demos",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]
exclude = [
    "demos/warehouse",
    "**/__pycache__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "warehouse: full real-warehouse validation; opt-in via COLUMNA_BENCH_WAREHOUSE, excluded in CI.",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Correctness only (WP-0 ruling: the zero-behavior-change invariant controls over the spec's
# "E/F only" wording). F = pyflakes real bugs; E9 = syntax errors. NO pycodestyle style rules —
# the verbatim library/demo code must not be reformatted (no style crusade).
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# The package facade intentionally re-exports its public API; those names are unused *here* but are
# the whole point of __init__ (see __all__). Suppress unused-import / import-star only for it.
"src/columna_core/__init__.py" = ["F401", "F403", "F405"]
# The v0.7.8 worklist (items 1-2) fixed the library pyflakes findings that WP-0 had config-ignored
# (parser.py F821 `Optional`; the unused-import / dead-local / F541 cruft in disclosure/engine/
# model/parser), so those per-file-ignores are tightened back out here.
# Demo suites are shipped VERBATIM as executable documentation (they are not edited); their
# pre-existing findings (unused imports; confine_demo re-imports Manifold/FunctionalEdge/
# DimensionLevel locally) stay suppressed.
"demos/*.py" = ["F401", "F811", "F841"]
