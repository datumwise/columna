[build-system]
# Build deps are capped too: a build backend that breaks stops the release that carries the fix,
# which is as user-visible as a runtime break. Floor 1.27 = the first hatchling with PEP 639
# (`license` string + `license-files`), which this file uses.
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "columna-server"
version = "0.11.1"
description = "Columna MCP server — a library of Manifolds exposed to AI agents over MCP, one contract (the four moods as data)."
readme = "README.md"
# Matches columna-core's ceiling — see that file for why. Declared here too rather than inherited
# transitively, so `pip install columna-server` alone also refuses cleanly on 3.14 (the WP-0
# pyarrow lesson: state the constraint where the install actually happens).
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "Datumwise" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Internal deps are capped at the MAJOR, deliberately not the minor. A `<0.14` here would
    # deadlock the house's own lockstep: core moves to 0.14.0 while this server needs no change,
    # and the umbrella — which requires both — becomes unresolvable. The floor is what carries the
    # contract (see 0.8.0: "a FLOOR, not a preference"); the cap is the wholesale-break boundary.
    "columna-core>=0.13.3,<1.0",
    # CAPPED 2026-07-29 AFTER A LIVE BREAK. `mcp>=1.0` was unbounded; `mcp 2.0.0` published
    # 2026-07-28 13:45 UTC (four minutes after 1.29.0, hours after our public launch) moved
    # `mcp.server.fastmcp`, and every fresh `pip install columna` from that minute resolved to it
    # and died at import. Lift to `<3.0` only after server.py is ported to the 2.x import path and
    # the stdio acceptance suite is green against it.
    "mcp>=1.0,<2.0",
    "tomli>=2.0,<3.0; python_version < '3.11'",
    # store.py imports duckdb directly to load the connector's warehouse — declare it explicitly
    # rather than rely on columna-core pulling it transitively (the WP-0 pyarrow lesson).
    "duckdb>=1.0,<2.0",
]

[project.optional-dependencies]
http = ["uvicorn>=0.23,<1.0", "starlette>=0.37,<2.0"]
agent = ["anthropic>=0.40,<1.0"]
test = ["pytest>=8.0,<10.0", "pytest-asyncio>=0.23,<2.0"]

[project.scripts]
columna-server = "columna_server.cli:main"

[tool.hatch.build.targets.wheel]
# hatchling includes ALL files under the package dir (not just .py), so the packaged demo data
# (src/columna_server/demo/**: manifold.cml + data.toml + the small bundled warehouse) ships in the
# wheel automatically — no force-include needed. `columna-server demo` therefore runs with no path
# args from a clean-venv wheel install (proven by the py3.10 wheel job in CI).
packages = ["src/columna_server"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "fixtures", "demos", "README.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "llm: live test that calls a real LLM provider; needs ANTHROPIC_API_KEY, excluded from CI.",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["F", "E9"]
