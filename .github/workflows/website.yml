name: website

# The site build is SPLIT (Huayin ruling, 2026-07-17):
#   • branch-coherent (PR + branch pushes): the transcript is generated from the BRANCH packages
#     (editable), so a PR verifies the site against the code it rides with — this gate goes green when
#     the branch is internally coherent, even before a release.
#   • shipped-coherent (deploy, main only): the transcript is generated from the SHIPPED (PyPI-pinned)
#     package, and only this job deploys. The deploy-wedge's guarantee lives WHOLLY here — the site is
#     structurally incapable of deploying a transcript it did not generate from the real shipped package.
on:
  push:
    branches: [main, wp5.1-website, wp-cp3]
    paths: ['apps/website/**', '.github/workflows/website.yml', 'packages/**', 'docs/**']
  pull_request:
    paths: ['apps/website/**', '.github/workflows/website.yml', 'packages/**', 'docs/**']

defaults:
  run:
    working-directory: apps/website

jobs:
  branch-coherent:
    name: site build (branch-coherent, PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Install the BRANCH packages (editable) — branch-coherent
        run: |
          pip install -e ../../packages/columna-core
          pip install "mcp>=1.0" "tomli>=2.0; python_version < '3.11'"
          pip install --no-deps -e ../../packages/columna-server
          # the umbrella, editable, so the branch build reports the release version like the deploy does
          pip install --no-deps -e ../../packages/columna

      - name: Generate the integrity transcript from the BRANCH package (fails closed)
        run: |
          mkdir -p src/data
          python scripts/gen_transcript.py > src/data/transcript.generated.json
          echo "transcript bytes: $(wc -c < src/data/transcript.generated.json)"

      - name: Generate the /case seeds from the BRANCH package (fails closed on exemplar drift)
        run: |
          python scripts/gen_case.py > src/data/case.generated.json
          echo "case bytes: $(wc -c < src/data/case.generated.json)"

      - name: Generate the Universe Visual (Figure 1) from the BRANCH package (fails closed)
        run: |
          python scripts/gen_universe_visual.py > src/data/universe_visual.generated.json

      # The shipped GRAMMAR REFERENCE (/docs/grammar). Fails closed three ways: no docstring grammar
      # block, an example the parser rejects, or a _KW token documented nowhere on the page.
      - name: Generate the shipped grammar reference from the BRANCH package (fails closed)
        run: |
          python scripts/gen_grammar.py > src/data/grammar.generated.json
          echo "grammar bytes: $(wc -c < src/data/grammar.generated.json)"
          echo "universe-visual bytes: $(wc -c < src/data/universe_visual.generated.json)"

      - name: Install site dependencies
        run: npm ci
      # SITE_BUILD_SHA is exported EXPLICITLY rather than relying on the runner's ambient GITHUB_SHA:
      # this flow builds in a GitHub runner and ships prebuilt, so Vercel's own VERCEL_GIT_COMMIT_SHA
      # carries no commit metadata (it arrives EMPTY, which is what silently disabled the edge
      # cache-buster before #88). See apps/website/src/lib/buildStamp.ts.
      - name: Build
        env:
          SITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

  shipped-coherent:
    name: site build + deploy (shipped-coherent)
    # the deploy path — the wedge: only main pushes, and the transcript must generate from PyPI.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      # The UMBRELLA `columna` is pinned alongside its libs so the generators can report the
      # release/install version into the site (Huayin's version ruling, 2026-07-25). Verified by
      # dry-run: columna==0.13.2 resolves to exactly columna-core==0.13.2 + columna-server==0.8.1 —
      # the versions already pinned, which stay as guards. THE PIN AND THE GENERATOR MUST SHIP
      # TOGETHER: the generator reporting `columna` without this pin is what produced a null version
      # on prod (2026-07-26) — the generator landed, the pin did not.
      # RETRY WITH BACKOFF, FAIL-CLOSED PRESERVED (2026-07-26). The 0.13.1 deploy failed here with
      # "Could not find a version that satisfies columna==0.13.1" MINUTES AFTER the same pin had been
      # verified installable from a developer machine. PyPI's index is CDN-distributed: /simple/ and
      # /pypi/…/json are separately cached, and edges converge at different times. So ONE OBSERVER'S
      # "installable" IS NOT GLOBAL AVAILABILITY — the runner resolves from a different edge than the
      # person who checked. Publish-first means installable; this is what makes that claim true for
      # THIS consumer rather than for the one who happened to look.
      #
      # RE-PROVED 2026-07-27, FROM THE OTHER DIRECTION. At 0.13.2 the two endpoints disagreed the
      # opposite way: /pypi/columna-core/json reported 0.13.2 NOT PRESENT while /simple/columna-core/
      # — the index pip actually resolves from — was already serving it. A checker reading the JSON API
      # would have declared the release broken and rolled back a release that was, in fact, live.
      # So the clause is symmetric, and that is the point: the JSON API is not a slower mirror of the
      # truth, it is a DIFFERENT VANTAGE POINT that can be stale in either direction. Verify
      # installability with the resolver a consumer actually uses (pip against /simple/), never with
      # a metadata endpoint that merely describes it. A convenient observation is still an observation.
      # The wedge KEEPS ITS JOB: the retry budget is bounded, and exhausting it still exits non-zero.
      # This buys propagation time; it does not forgive a missing package.
      #
      # BUDGET 5 -> 8 (2026-07-27, launch eve). The 0.13.2 deploy resolved ON ATTEMPT 5 OF 5 — the last
      # one. It did not fail, and that is the problem: a guard that clears on its final attempt has no
      # margin left to report. THE BELT, NOT THE FIX. The real cause is ORDER, not budget: merging to
      # main triggers the deploy while publish is triggered by the release cut that necessarily follows
      # the merge, so the deploy always races the publish. That is fixed by CHOREOGRAPHY, not code —
      # tag the release branch BEFORE merging, let publish fire and the verbatim-pin gate clear, THEN
      # merge, so the deploy finds packages already installable. See docs/RELEASE_ORDER.md; it is the
      # standing release order and it costs nothing. This wider budget is only the belt for a Tuesday
      # emergency where someone runs the order backwards under pressure.
      - name: Install the SHIPPED package from PyPI (pinned) — the deploy wedge
        run: |
          set -euo pipefail
          # DERIVED, NEVER HAND-TYPED (2026-07-29). These pins used to be a literal — a second copy
          # of the release version kept in sync by memory. On the v0.13.3 flip the copy was stale, so
          # the wedge installed the PREVIOUS, BROKEN triad (0.13.2 / 0.8.1, the one that died on
          # mcp 2.0), reported "resolved on attempt 1", and the site published 0.13.2 as current
          # while PyPI served 0.13.3. A missing package fails loudly; a SUPERSEDED one resolves.
          # Reading the pins from the pyprojects makes the wedge assert what it always claimed to:
          # the site is built by the packages THIS COMMIT says it shipped. See scripts/release_pins.py.
          # $GITHUB_WORKSPACE, not a relative path: this job's working-directory is apps/website.
          PINS_STR="$(python "${GITHUB_WORKSPACE}/scripts/release_pins.py" || true)"
          # A DERIVATION FAILURE IS NOT PROPAGATION LAG — fail NOW, do not spend the retry budget.
          # First cut of this used a relative path, produced an empty pin list, and the loop dutifully
          # retried "pip install <nothing>" eight times over ~560s before failing with a message about
          # index propagation. It failed closed (right) for a reason it named wrongly (not right).
          # Retries are for a release that exists and has not propagated; a broken derivation is a
          # config error and gets an immediate, honestly-labelled death.
          if [ -z "${PINS_STR}" ]; then
            echo "::error::deploy wedge: could not DERIVE the pinned triad from the pyprojects " \
                 "(scripts/release_pins.py produced nothing). This is a config error in the workflow, " \
                 "not index propagation. Not retrying."
            exit 1
          fi
          read -r -a PINS <<< "${PINS_STR}"
          echo "deploy wedge: pinned triad (derived from pyproject) = ${PINS[*]}"
          ATTEMPTS=8
          for attempt in $(seq 1 "${ATTEMPTS}"); do
            if pip install --no-cache-dir "${PINS[@]}"; then
              echo "deploy wedge: resolved on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -eq "${ATTEMPTS}" ]; then break; fi
            delay=$((attempt * 20))
            echo "deploy wedge: pin not resolvable yet (attempt ${attempt}/${ATTEMPTS}) — index propagation; retrying in ${delay}s"
            sleep "${delay}"
          done
          echo "::error::deploy wedge FAILED CLOSED — the pinned triad is still not installable after ${ATTEMPTS} attempts (~560s of backoff). This is not propagation lag; the packages are absent or the pin is wrong. Refusing to build the site against packages it cannot install."
          exit 1

      # PROSE-COHERENCE TRIPWIRE (from the #45 incident): the integrity gate guards WIRE, not WORDS.
      # This parse-checks every documented FrameQL block in the corpus + llms files against the INSTALLED
      # shipped package — documented syntax the shipped parser rejects fails the deploy. It fails closed
      # against a package too old to run the documented (envelope) grammar; it goes green once the pin
      # is the version that ships that grammar. Bump the pin above in the same flip that ships 0.9.0.
      - name: Prose-coherence tripwire (corpus + llms parse against the shipped package)
        run: python scripts/check_prose_coherence.py

      - name: Generate the integrity transcript from the SHIPPED package (fails closed)
        run: |
          mkdir -p src/data
          python scripts/gen_transcript.py > src/data/transcript.generated.json
          echo "transcript bytes: $(wc -c < src/data/transcript.generated.json)"

      # The /case seeds need the Cascadia code (logical_spec/physical_map/recapture + the cascadia demo),
      # which ships at the 0.10.0 flip. This step goes green on the deploy path only once the pin above
      # is 0.10.0 — bump it in the same flip that merges the /case section to main (the draft-lock).
      - name: Generate the /case seeds from the SHIPPED package (fails closed on exemplar drift)
        run: |
          python scripts/gen_case.py > src/data/case.generated.json
          echo "case bytes: $(wc -c < src/data/case.generated.json)"

      - name: Generate the Universe Visual (Figure 1) from the SHIPPED package (fails closed)
        run: |
          python scripts/gen_universe_visual.py > src/data/universe_visual.generated.json

      # The shipped GRAMMAR REFERENCE (/docs/grammar). Fails closed three ways: no docstring grammar
      # block, an example the parser rejects, or a _KW token documented nowhere on the page.
      - name: Generate the shipped grammar reference from the SHIPPED package (fails closed)
        run: |
          python scripts/gen_grammar.py > src/data/grammar.generated.json
          echo "grammar bytes: $(wc -c < src/data/grammar.generated.json)"
          echo "universe-visual bytes: $(wc -c < src/data/universe_visual.generated.json)"

      # THE FLAP DETECTOR (0.13.1). A recorded exhibit changes ONLY by re-recording — this enforces the
      # other half: that it does not change by ITSELF. The alloc badge rendered `-0.0000` on ~20% of
      # runs of an IDENTICAL package and input (float summation order), and it reached a byte-preserved
      # artifact, so every deploy was a coin flip. Fixed at the cause in core 0.13.1; this is the
      # structural half, so the CLASS cannot recur silently in any generator.
      - name: Flap detector — every committed-output generator must be reproducible (fails closed)
        run: python scripts/check_generator_determinism.py

      - name: Install site dependencies
        run: npm ci
      # SITE_BUILD_SHA is exported EXPLICITLY rather than relying on the runner's ambient GITHUB_SHA:
      # this flow builds in a GitHub runner and ships prebuilt, so Vercel's own VERCEL_GIT_COMMIT_SHA
      # carries no commit metadata (it arrives EMPTY, which is what silently disabled the edge
      # cache-buster before #88). See apps/website/src/lib/buildStamp.ts.
      - name: Build
        env:
          SITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Deploy to Vercel (production, prebuilt)
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # `vercel build` runs the Astro build AGAIN inside the CLI, so the stamp must be present here
          # too — this is the build whose output actually ships.
          SITE_BUILD_SHA: ${{ github.sha }}
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      # POST-DEPLOY EDGE VERIFICATION (2026-08-03). The wedge above guarantees the site cannot BUILD a
      # transcript it did not generate from the shipped package. This closes the other end: the site
      # cannot silently SERVE a build it did not just deploy. The failure it exists for is real and
      # observed — after the #133/#134 deploys, an edge PoP kept serving the pre-deploy HTML for ~7
      # hours (x-vercel-cache HIT, age 25382) while the deploy job reported success. A green deploy that
      # leaves stale bytes at the edge is exactly the class of silent failure this whole project opposes.
      #
      # It curls the PRODUCTION URL a real visitor hits (no cache-busting query — a query mints a
      # different cache key and would mask a stale no-query path) and asserts the served <meta name=
      # "build"> equals THIS deploy's commit. On persistent mismatch it forces ONE re-deploy — a fresh
      # immutable deployment + alias flip is the only global edge flush available from here — then
      # re-verifies, and fails loudly if the edge is still stale.
      - name: Post-deploy edge verification — prod must serve THIS build, not a stale one
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SITE_BUILD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          URL="https://datumwise.ai/"
          EXPECT="${SITE_BUILD_SHA}"
          served() {
            curl -fsS -H 'Pragma: no-cache' -H 'Cache-Control: no-cache' "${URL}" \
              | grep -oE '<meta name="build" content="[0-9a-f]{40}"' | grep -oE '[0-9a-f]{40}' | head -1
          }
          verify() {
            for attempt in 1 2 3 4 5; do
              GOT="$(served || true)"
              if [ "${GOT}" = "${EXPECT}" ]; then
                echo "post-deploy: production serves ${GOT} == this deploy ✓"; return 0
              fi
              echo "post-deploy: prod serves '${GOT:-<none>}', expected '${EXPECT}' (attempt ${attempt}/5) — edge not flushed yet; backing off"
              sleep $((attempt * 15))
            done
            return 1
          }
          if verify; then exit 0; fi
          echo "post-deploy: edge still stale after backoff — forcing ONE re-deploy to flush it"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" || true
          if verify; then exit 0; fi
          echo "::error::POST-DEPLOY VERIFICATION FAILED — production is serving build '${GOT:-<none>}' but this run deployed '${EXPECT}'. The edge is stale even after a forced re-deploy. This site cannot demo what it did not ship; it must not silently serve stale either. Failing loudly so a human looks now, not in 7 hours."
          exit 1
