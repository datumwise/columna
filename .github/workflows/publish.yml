name: Publish

# Build both packages on every PR (dry run — no upload), and publish to PyPI when a GitHub Release
# is published. Publishing is OIDC via PyPI Trusted Publishers — no API tokens are stored anywhere.
on:
  release:
    types: [published]
  pull_request:
  # THE GATE WAS REACHABLE ONLY FROM A PULL REQUEST (P1-29, ruled Huayin 2026-09-02).
  #
  #     Every change capable of altering a shipped payload must encounter the payload-coherence
  #     gate before release.
  #
  # With `release` + `pull_request` alone there are exactly two routes in, and a payload-affecting
  # change sitting on a branch with no PR meets the gate for the first time AT RELEASE — the one
  # moment refusing is no longer free. That is not hypothetical: columna-server payload drift landed
  # on a branch that carried no PR for two days (8b2a29e, 5dc2ef5) and was found on 2026-09-02 only
  # because someone ran the gate by hand.
  #
  # NO PATH FILTER, DELIBERATELY. The obvious repair — enumerate the payload-affecting paths — would
  # create a SECOND, hand-maintained definition of "payload-affecting change" beside the one this job
  # already computes by building each wheel and diffing it against the wheel PyPI serves. Two
  # definitions drift, and the one that drifts SILENTLY is the path filter: it goes stale by omission,
  # and its failure mode is a gate that does not run. The gate needs no such definition. It answers
  # the question empirically, on every trigger, and costs ~90s to do it.
  push:
    branches: [main]
  # THE INDEPENDENT HEARTBEAT. `push: main` covers what lands; this covers what is ALREADY there. A
  # red main must be able to surface on its own schedule rather than waiting for someone to happen to
  # open a PR — the same has-to-be-loud principle docs.yml adopted after the 2026-07-19 masking
  # incident, applied to the guard whose failure is the most expensive of the three.
  schedule:
    - cron: '31 6 * * 1'        # Mondays 06:31 UTC — offset from docs.yml's 06:17
  workflow_dispatch:

jobs:
  build:
    name: build + check dists (dry run on PRs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdists + wheels for all three packages
        run: |
          python -m pip install --upgrade pip build twine
          python -m build packages/columna-core   --outdir dist
          python -m build packages/columna-server --outdir dist
          python -m build packages/columna        --outdir dist   # the metapackage (lockstep with core)
      - name: Validate metadata
        run: python scripts/gates.py --gate twine-metadata
      # THE PAYLOAD/VERSION GATE (Huayin, 2026-08-20, after the v0.15.0 incident). `skip-existing`
      # must never silently turn "same version" into "therefore same package". This compares each
      # BUILT wheel against the wheel PyPI already serves for that same version, normalized (dist-info
      # prefix folded, RECORD/WHEEL dropped as toolchain noise, METADATA KEPT because dependency
      # floors are payload). A version already published whose payload has changed fails here —
      # before the release, while refusing is still free.
      #
      # It runs in the BUILD job, not the publish job, so it also gates every PR: the question
      # "would this tree ship changed content under a version already on PyPI" has an answer long
      # before anyone cuts a tag.
      - name: No package ships changed content under a reused version
        run: python scripts/gates.py --gate payload-coherence
      - name: Show dists
        run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: publish to PyPI (Trusted Publisher / OIDC)
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # MUST match the Trusted Publisher registration on PyPI for ALL THREE packages — columna-core,
    # columna-server, and columna (the metapackage) — owner datumwise, repo columna, workflow
    # publish.yml, environment pypi. PyPI routes each dist to its project by the name in its metadata.
    environment: pypi
    permissions:
      id-token: write        # OIDC token for Trusted Publishing — this job only
    steps:
      - uses: actions/checkout@v4              # for scripts/assert_pypi_versions.py + the pyprojects
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PRE-PUBLISH GATE (Huayin, 2026-08-20). The only place a RELEASE VERSION exists is here, on
      # the release event — so this is where the tag is bound to the artifacts it claims to name.
      # Runs BEFORE the upload, deliberately: a PyPI artifact cannot be withdrawn or replaced, so a
      # release set must be refused while refusing it is still free. `--check` also re-runs the
      # lockstep and core-floor halves, so a tag cut from a branch that never saw CI is still gated.
      - name: Release set matches the tag (lockstep + core floor + tag binding)
        run: python scripts/gates.py --gate release-set-tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Uploads every dist in dist/; PyPI routes each file to its project (columna-core /
      # columna-server / columna) by the name in the package metadata — all three have the Trusted
      # Publisher. `skip-existing` is REQUIRED with the lockstep/metapackage layout: a release rebuilds
      # all three, but a package whose version did not change is already on PyPI (e.g. columna-core /
      # columna-server when only `columna` is new). Without skip-existing, re-uploading an existing
      # file 400s and fails the whole job — so the genuinely new dist would never publish.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
      # Post-publish guard: every package's intended version (from its pyproject) MUST now be live on
      # PyPI. This is the check skip-existing needs — it can never silently mask a forgotten bump or a
      # swallowed upload error, because a release that did not actually publish what it claimed fails
      # here, loudly.
      - name: Assert every intended version is live on PyPI
        run: python scripts/gates.py --gate pypi-versions
