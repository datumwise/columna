name: docs

# The manual's integrity rule (ADR-035 D4): every executable Frame-QL example is regenerated BY
# EXECUTION against the shipped package; an example that stops parsing, errors, or whose committed
# output drifts fails this build. Separate from the website workflow — publishing docs/ does NOT
# trigger a site deploy (website.yml filters on apps/website/** only).
on:
  push:
    branches: [main, wp-manuals-alignment]
    paths: ['docs/**', 'packages/*/README.md', 'apps/website/src/pages/docs/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'packages/*/README.md', 'apps/website/src/pages/docs/**', '.github/workflows/docs.yml']
  # THE MASKING FIX (Huayin, 2026-07-25). The path filter above is what let a red `main` hide from
  # 2026-07-19 to 2026-07-25: regen-check was broken by purged grammar, but nothing touched `docs/**`,
  # so the job simply never ran and no one saw a failure. A weekly run means the truth about `main`
  # surfaces on its own schedule, independent of what anyone happens to edit. Same has-to-be-loud
  # principle as the build-stamp assertion — applied to CI VISIBILITY rather than to a value.
  schedule:
    - cron: '17 6 * * 1'        # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  regen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the shipped packages
        run: |
          python -m pip install -U pip
          pip install ./packages/columna-core ./packages/columna-server
      - name: Regenerate Frame-QL examples by execution (check mode)
        run: python docs/tools/regen_examples.py --check
      # Standing test riding the manuals merge (from the CP-M2 parser self-verification rider): every
      # FrameQL example in the manual parses clean against the shipped parser, or is fenced
      # `frameql-illformed` (deliberately ill-formed). The manual can never document syntax its own
      # parser rejects. Green once columna-core is 0.9.0 (the envelope parser); this rides the flip.
      - name: FrameQL manual parses against the shipped parser
        run: python docs/tools/check_manual_frameql.py

      # UNIT C (2026-08-31). The manuals asserted a purchasable "Pro" tier for four days after the
      # ruling that retired it, on two live routes and in the /ask retrieval index — because prose is
      # the one surface with no compiler and nothing in CI read it. This is that compiler. It also
      # enforces the other half of §17.5: preserved prior-edition records must SAY they are preserved,
      # since a stale document with no banner is indistinguishable from a current one.
      - name: No tier claims on a current surface
        run: python docs/tools/check_no_tier_claims.py

      # THE LEDGER HEARTBEAT (Huayin, 2026-07-25). The weekly run prints every OPEN row of both
      # ledgers into this job's summary, so the ledger ARRIVES instead of waiting to be consulted —
      # the structural fix for the NON-USE failure (the fossil ruling evaporated while a ledger that
      # would have caught it sat unread). `always()` on purpose: a red run is precisely when you most
      # want to see what main owes, so the heartbeat must not be skipped by an earlier failure.
      - name: Ledger heartbeat — open doctrine gaps + open forks
        if: always()
        # tee, not >: the summary is the product, but piping it through stdout as well puts the
        # ledger in the JOB LOG too — so it is readable from the API/CLI and verifiable after the
        # fact, not only by eye in the run UI. (A redirect alone made the content unreadable
        # anywhere but the browser, which is a poor property for a thing meant to be checked.)
        run: python scripts/print_ledgers.py | tee -a "$GITHUB_STEP_SUMMARY"
