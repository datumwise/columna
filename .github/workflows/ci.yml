name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 added in 0.13.2 alongside the requires-python ceiling: the classifiers now claim
        # 3.10–3.13, and a claimed version that CI never runs is a claim nobody checked.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/columna-core[test]"
          # CI RESOLVES THE SERVER'S DEPS FROM ITS OWN METADATA — no hand-copied specs (0.13.3).
          # This step used to read `pip install "mcp>=1.0" ...`, a transcription of the pyproject
          # kept in sync by memory. It drifted in the worst possible direction: CI installed mcp
          # from a spec that was not the shipped one, so the shipped constraint was never the thing
          # under test. Installing the package itself means a cap can never be right here and wrong
          # on PyPI. The local editable columna-core already satisfies the server's floor, so pip
          # does not go to the index for it.
          pip install -e "packages/columna-server[test]"
          pip install ruff

      # Bare invocations: exit codes count (no pipe through tail/head).
      - name: Ruff (correctness only — F, E9)
        run: |
          ruff check packages/columna-core/src packages/columna-core/demos packages/columna-core/tests
          ruff check packages/columna-server/src packages/columna-server/tests

      # COLUMNA_BENCH_WAREHOUSE is intentionally unset, so the 20 @pytest.mark.warehouse proofs are
      # skipped: columna-core collects 124 / runs 104 / skips 20.
      - name: Pytest — columna-core (fixture-backed; warehouse proofs skipped)
        run: pytest packages/columna-core -q

      - name: Pytest — columna-server (MCP stdio acceptance + packaged demo)
        run: pytest packages/columna-server -q

      # One cheap regression over the whole wedge path: the demo prints all four moods in order.
      # Post-§2c the tour is clarify -> refuse -> disclose -> serve; disclose is driven by
      # `SELECT level.sum AT {store*cal.month}` (a stock summed across the blocked day->month axis — a material
      # b_anchor_crossing caveat), the well-posed replacement for the retired cross-universe wedge.
      - name: Demo smoke (demo --play, four moods in order)
        run: |
          columna-server demo --play | python -c "import sys; s=sys.stdin.read(); \
          i=[s.find('\"outcome\": \"%s\"' % m) for m in ('clarify','refuse','disclose','serve')]; \
          assert -1 not in i and i == sorted(i), i; \
          assert '\"contract_version\": \"4\"' in s; print('demo --play smoke OK:', i)"

  # THE PUBLICATION REGISTRY GATE (Slice 2 item 1, 2026-08-21). Runs on EVERY push and PR, with no
  # path filter, deliberately: its whole job is to catch a publication fact appearing somewhere nobody
  # expected one. A gate scoped to the paths it already knows about cannot do that.
  #
  # It is hermetic — registry vs a frozen Zenodo snapshot, no network — so it is fast and it cannot go
  # red because Zenodo had a bad afternoon. `--live` re-verification exists and is run by hand when a
  # deposit changes, not on every commit.
  publication-registry:
    name: publication registry (fails closed on an unregistered DOI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git grep over the working tree is the whole mechanism; a shallow checkout is fine, but the
          # gate needs the FILES, so no sparse/blobless tricks here.
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the publication registry
        # --selftest first: the attachment set-semantics fixtures are hermetic (no registry, no
        # network) and pin that `attachedConcepts` order carries no law. A fixture nobody runs is not
        # a fixture, so it rides the job that already exists rather than getting one of its own.
        run: python scripts/check_publications.py --selftest --report

      - name: Check current-corpus membership (fails closed on an unadjudicated source)
        # Membership is EXHAUSTIVE by construction: every catalogued source must be ruled IN,
        # REFERENCE ONLY or OUT. A new source fails the build until someone rules on it — the same
        # discipline as G7's echo audit, applied to corpus standing instead of publication facts.
        run: python scripts/check_corpus_membership.py

      - name: Check the ingested deposit corpus (offline, no Zenodo dependency)
        # Verifies the stored deposited texts still match their recorded checksums AND that each is
        # pinned to the record the registry currently rules `current`. Offline on purpose: CI must
        # not fail because Zenodo is having a bad afternoon.
        run: python services/ask/ask/ingest_deposits.py --check

  # Item (c): prove the packaged demo runs from a clean-venv WHEEL install — the package-data-ships
  # acceptance. Two legs, and the second one is the point:
  #
  #   ubuntu-latest / 3.10 — the weakest Python (importlib.resources directory traversal for zipped
  #     resources is 3.12+; pip installs unzipped so 3.10 works, and this leg proves it).
  #   windows-latest / 3.13 — the weakest PLATFORM. Added in 0.13.2 after a Windows fresh-venv pass
  #     found `pip install columna` detonating into a datasketches C++ source build (no cp314 wheels
  #     exist for 5.x on any platform, and no win32 wheels at any version). That class — a dependency
  #     with platform/version wheel gaps — was invisible to a Linux-only CI, which is exactly how the
  #     finding survived three releases. It is now caught forever, on the platform that catches it.
  #
  # Both legs run the SAME assertion file (scripts/assert_demo_play.py) rather than an inline
  # `python -c`, so they cannot silently drift into proving different things.
  demo-wheel-install:
    name: demo wheel install (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            venv-bin: bin
            exe: ""
          - os: windows-latest
            python-version: "3.13"
            venv-bin: Scripts
            # pip installs the console script as columna-server.EXE on Windows. Named explicitly
            # rather than leaning on Git Bash's implicit .exe resolution for an explicit relative
            # path — the whole point of this leg is to stop guessing about Windows.
            exe: ".exe"
    defaults:
      run:
        # Git Bash on windows-latest, so one script body serves both legs (globs, `|`, forward
        # slashes). Only the venv bin directory differs, and that is the matrix's job.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels and install into a clean venv
        run: |
          python -m pip install --upgrade pip build
          python -m build packages/columna-core
          python -m build packages/columna-server
          python -m venv demoenv
          demoenv/${{ matrix.venv-bin }}/python -m pip install --upgrade pip
          demoenv/${{ matrix.venv-bin }}/python -m pip install \
            packages/columna-core/dist/*.whl packages/columna-server/dist/*.whl
      - name: Show what actually resolved (wheel vs source build)
        run: demoenv/${{ matrix.venv-bin }}/python -m pip list
      - name: demo --play from the installed wheel (package-data proof)
        run: |
          demoenv/${{ matrix.venv-bin }}/columna-server${{ matrix.exe }} demo --play \
            | demoenv/${{ matrix.venv-bin }}/python scripts/assert_demo_play.py

  dep-caps:
    name: dependency cap guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # THE CLASS GUARD FOR DEPENDENCY METADATA (Huayin, 2026-07-29). Twice now an uncapped
      # dependency has broken users with nothing in this repo changing: datasketches/3.14 on
      # launch eve (0.13.2, caught by a human on a Windows pass) and `mcp>=1.0` the day after
      # launch (0.8.1 — mcp 2.0.0 landed 2026-07-28 13:45 UTC and moved fastmcp; every fresh
      # `pip install columna` died at import). The third instance should be impossible by
      # construction, not by vigilance. No path filter, and it runs on push as well as PR: this
      # failure class arrives WITHOUT a diff, so it must be checked on every build, not only on
      # the ones that touch packaging.
      - name: Every declared dependency carries an upper bound
        run: python scripts/assert_dep_caps.py

  release-set:
    name: release-set coherence guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # THE CLASS GUARD FOR THE RELEASE SET (Huayin, 2026-08-20). Found in the v0.15.0 preflight,
      # before the tag: core was bumped to 0.15.0 and the umbrella `columna` was left at 0.14.0.
      # Nothing downstream would have caught it — `assert_pypi_versions.py` passes because the stale
      # umbrella version IS live on PyPI; the homepage's fail-closed release rail passes because the
      # stale version HAS a curated entry; the dependency graph stays satisfiable, so the deploy
      # wedge resolves and goes green. Production would have announced the previous release while
      # PyPI served the new one. A stale pin resolves; a stale VERSION resolves too.
      #
      # No path filter, and it runs on push as well as PR: like the cap guard, this failure class
      # arrives WITHOUT a diff — it is what a diff FORGOT to contain.
      - name: Umbrella and core share the release version, and the floor does not lag
        run: python scripts/release_pins.py --check
      - name: The guard's own regression fixtures (incl. the 2026-08-20 stale-resolvable state)
        run: python scripts/release_pins.py --selftest

  currency-stamps:
    name: currency-stamp guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # THE CLASS GUARD FOR DOCUMENTED CURRENCY (2026-08-22). The Frame-QL Manual's body was
      # reconciled through 2026-08-20 while its header still said it documented columna-core 0.14.0
      # at wire contract "2" — four releases behind — and `contract_version "1"` was live on
      # /llms.txt through TWO contract bumps. Nothing caught either: the parse gates check grammar,
      # `check_prose_coherence.py` checks grammar, and `/docs/grammar` cannot go stale only because
      # it is GENERATED rather than asserted. A claim about what ships had no guard at all.
      #
      # IT BELONGS HERE, NOT IN docs.yml, AND THAT IS THE WHOLE POINT. `docs.yml` is path-filtered to
      # `docs/**`, which is exactly why this drifted: four releases moved `packages/**` and the docs
      # job never ran. A guard must follow the thing that CHANGES the truth — the package version —
      # not the thing that states it. So: no path filter, on push as well as PR, like the release-set
      # and cap guards. This failure class arrives WITHOUT a diff; it is what a diff forgot.
      #
      # The install is columna-core alone: the guard reads the wire contract by IMPORTING
      # `columna_core.disclosure_wire.CONTRACT_VERSION` from the package rather than trusting a
      # literal, and reads the package triad from `scripts/release_pins.py` — the working tree, so
      # the stamps are checked against what THIS COMMIT would ship, before it ships.
      - name: Install columna-core (the guard reads the contract from the package, never a literal)
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/columna-core
      - name: Documented current-state stamps match the shipped set
        run: python scripts/check_currency_stamps.py

  purged-grammar:
    name: purged-grammar guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # THE CLASS GUARD (Huayin, 2026-07-25, item 7). Guarding the instances would have fixed a day;
      # this guards the class. Any reappearance of the purged `EDGE ... ALONG ... VIA` surface fails
      # here. Deliberate uses mark themselves INTENTIONALLY-PURGED; fossils too large for the PR that
      # finds them are ROWED against an OPEN fork, and the guard fails if that row is ever closed
      # while the fossil remains. No path filter — fossils accumulated silently once.
      - name: No purged grammar anywhere in the repo
        run: python scripts/check_purged_grammar.py

  build:
    name: build wheels + sdists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build packages/columna-core
          python -m build packages/columna-server
      - name: Show artifacts
        run: ls -l packages/columna-core/dist packages/columna-server/dist
      # Install the core wheel into a FRESH venv (only its declared deps) and RUN a real fetch — this
      # is what catches an undeclared hard runtime dep (e.g. pyarrow) that an import-only check misses.
      - name: Wheel smoke (clean venv, real fetch)
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install packages/columna-core/dist/*.whl
          /tmp/wheelenv/bin/python packages/columna-core/tests/smoke_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: columna-dists
          path: |
            packages/columna-core/dist/*
            packages/columna-server/dist/*
