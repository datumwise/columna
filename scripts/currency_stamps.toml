# ── the packaged front door that carries a version (enrolled 2026-08-31, v0.18.1) ────────────────
# `packages/columna-core/README.md` is the wheel's `long_description` — the page a stranger reads on
# PyPI. Its H1 states the shipped version. PR #251 (P0-11/P0-13, packaged half) brought it level with
# 0.18.0 by hand, and it went stale again within the same release the moment the set moved to 0.18.1
# — found by this release, not by a guard, which is the whole argument for enrolling it. A version
# printed on the front door is a current-state claim of exactly the kind this manifest is for.
#
# Enrolled with a deliberately NARROW template: the H1 alone. The rest of that README — its version
# history blocks, its dated notes — stays history and stays out of the guard's reach.

[[stamp]]
file = "packages/columna-core/README.md"
claim = "packaged front door — the H1 states the shipped core version"
template = "# columna-core ({core})"
