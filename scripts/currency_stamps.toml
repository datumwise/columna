# THE ENROLLED CURRENT-STATE CLAIMS — the reviewable policy surface for the currency guard.
#
# WHY A MANIFEST AND NOT A SCANNER. A guard that hunts version tokens through prose would eventually
# "correct" a historical sentence, and rewriting the record is a worse failure than the drift it was
# built to catch. So the polarity is inverted: HISTORY IS THE DEFAULT, CURRENCY IS DECLARED. A string
# is checked only because a human enrolled it here. Everything else — `wire contract "1" -> "2"` at
# 0.14.0, `contract stays "1" at that release`, `the composite pin arrived in 0.13.4`, every dated
# `▸` note, every bibliography citation — is structurally outside the guard's reach. It cannot touch
# them because it never looks at them.
#
# WHAT AN ENTRY MEANS. `template` is rendered with the authoritative versions and the result must
# appear VERBATIM in `file`. Two failures follow, and both are correct:
#   · the version moved and the stamp did not  -> the rendered literal is absent -> FAIL
#   · the sentence was reworded                -> the rendered literal is absent -> FAIL
# The second is not a false positive. A currency claim that quietly stops existing is the same defect
# as one that quietly goes stale; either way the enrolment must be brought back into agreement with
# the prose, in this file, where the change is visible in review.
#
# PLACEHOLDERS, all rendered from the shipped state, never typed:
#   {umbrella}  {core}  {server}   from scripts/release_pins.py  (the pyprojects; one policy source)
#   {contract}                     from columna_core.disclosure_wire.CONTRACT_VERSION
#
# Templates are matched as PLAIN TEXT, so they must not span a line wrap in the target file. Where a
# claim wraps, enrol the half that carries the version.
#
# COVERAGE (ruled 2026-08-22): the three surfaces repaired in PR #210. Not the bibliography
# citations (a citation naming the version it documented is dated, not stale), not /learn, not
# /docs/reference, not any dated historical note.
#
# COVERAGE, EXTENDED (2026-08-31, v0.18.1): one fourth surface — the packaged core README's H1, see
# the block at the foot of this file. Enrolment is how coverage grows; it grows by a named entry in
# this file and a reason beside it, never by the guard deciding on its own what looks current.

# ── docs/frame_ql_language.md ───────────────────────────────────────────────────────────────────
# The Manual is the normative reference for shipped syntax and behaviour, so every sentence in it
# that names what ships is enrolled — not merely the Currency paragraph. These nine are exactly the
# current-state stamps corrected in PR #210.

[[stamp]]
file = "docs/frame_ql_language.md"
claim = "Currency paragraph — the package triad"
template = "current for **columna {umbrella} · columna-core {core} ·"

[[stamp]]
file = "docs/frame_ql_language.md"
claim = "Currency paragraph — the server and the wire contract"
template = 'columna-server {server}**, wire `contract_version` **`"{contract}"`**.'

[[stamp]]
file = "docs/frame_ql_language.md"
claim = "edition block — 'documents it as implemented'"
template = "documents it **as implemented** (columna-core {core})."

[[stamp]]
file = "docs/frame_ql_language.md"
claim = "harness note — the parser the examples are checked against"
template = "parser (`columna_core.envelope.parse_statement`, columna-core {core})"

